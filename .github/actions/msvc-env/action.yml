name: MSVC developer environment
description: >-
  Puts the x64 MSVC toolchain (cl, link, INCLUDE, LIB, …) on the environment of the
  job's later steps by running Visual Studio's vcvars64.bat, found with vswhere.
  A composite action on purpose: it needs no Node.js runtime (it replaces
  ilammy/msvc-dev-cmd, which still runs on the deprecated Node 20).
runs:
  using: composite
  steps:
    - shell: pwsh
      run: |
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
        $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $vs) { throw 'No Visual Studio installation with the x64 C++ toolset was found.' }
        $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
        $before = @{}
        Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
        $lines = cmd.exe /d /s /c "`"$vcvars`" >nul 2>&1 && set"
        if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed with exit code $LASTEXITCODE" }
        foreach ($line in $lines) {
          if ($line -match '^([^=]+)=(.*)$' -and $before[$Matches[1]] -ne $Matches[2]) {
            "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
        }
        Write-Host "MSVC environment from $vcvars"
