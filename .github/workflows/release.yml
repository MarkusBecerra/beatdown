name: Release
on:
  push:
    tags: ["v*"]

jobs:
  linux:
    runs-on: ubuntu-22.04
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - name: Create vcpkg binary cache directory
        run: cmake -E make_directory .vcpkg-cache
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-default-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-default-
      - run: sudo apt-get update && sudo apt-get install -y ninja-build autoconf automake libtool pkg-config
      - run: ./external/vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - run: cmake --preset default -DBEATDOWN_BUILD_TESTS=OFF && cmake --build --preset default
      - run: tar -C build/default -czf beatdown-${{ github.ref_name }}-linux-x86_64.tar.gz beatdown
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: "*.tar.gz" }

  macos:
    runs-on: macos-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - name: Create vcpkg binary cache directory
        run: cmake -E make_directory .vcpkg-cache
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-macos-universal-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-macos-universal-
      - run: brew install ninja pkg-config automake autoconf libtool
      - run: ./external/vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - run: cmake --preset macos-arm64 && cmake --build --preset macos-arm64
      - run: cmake --preset macos-x64 && cmake --build --preset macos-x64
      - run: |
          lipo -create build/macos-arm64/beatdown build/macos-x64/beatdown -output beatdown
          lipo -info beatdown
          tar -czf beatdown-${{ github.ref_name }}-macos-universal.tar.gz beatdown
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: "*.tar.gz" }

  windows:
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - name: Create vcpkg binary cache directory
        run: cmake -E make_directory .vcpkg-cache
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-default-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-default-
      - uses: ilammy/msvc-dev-cmd@v1
      - run: .\external\vcpkg\bootstrap-vcpkg.bat -disableMetrics
      - run: cmake --preset default -DBEATDOWN_BUILD_TESTS=OFF && cmake --build --preset default
      - run: Compress-Archive -Path build\default\beatdown.exe -DestinationPath beatdown-${{ github.ref_name }}-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "*.zip" }

  publish:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip
          generate_release_notes: true
